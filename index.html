<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotstar Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="assets/logo.png" alt="Hotstar Logo">
    </div>
    <nav>
        <a href="#">Home</a>
        <a href="#">TV Shows</a>
        <a href="#">Movies</a>
        <a href="#">Sports</a>
        <input type="text" placeholder="Search...">
    </nav>
</header>

<section class="hero">
    <img src="assets/movie1.jpg" alt="Main Featured">
    <div class="hero-text">
        <h1>Featured Movie</h1>
        <button onclick="play()">Play Now ▶️</button>
    </div>
</section>

<section class="movies">
    <h2>Recommended</h2>
    <div class="movie-row" id="movieRow"></div>
</section>

<script src="script.js"></script>
</body>
</html>
